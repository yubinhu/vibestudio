id = "hermes"
version = "2026.09.20.1"
min_engine_version = 2
updated_at = "2026-09-20T00:00:00Z"
aliases = ["hermes-agent"]

# Standard Python CLI controls verified against Hermes v2026.9.14:
# https://github.com/NousResearch/hermes-agent/blob/v2026.9.14/hermes_cli/cli_tui_mixin.py

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
regex = ['^⚠[\u{fe0e}\u{fe0f}]?(?:\s|$)']

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['^⏳[\u{fe0e}\u{fe0f}]?(?:\s|$)']

[[rules]]
id = "dangerous_command_approval"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(14)"
visible_blocker = true
any = [
  { contains = ["dangerous"] },
  { contains = ["approval"] },
  { contains = ["allow once", "deny"] },
  { line_regex = ['(?i)^\s*[▸>]?\s*1\.\s*allow'] },
]
all = [
  { any = [{ contains = ["enter confirm"] }, { contains = ["enter to confirm"] }, { contains = ["↑/↓ to select"] }, { contains = ["show full command"] }] },
]

[[rules]]
id = "clarification_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(14)"
visible_blocker = true
any = [
  { contains = ["hermes needs your"] },
  { line_regex = ['^\s*ask\s+\S'] },
  { contains = ["type your answer"] },
]
all = [
  { any = [{ contains = ["enter confirm"] }, { contains = ["enter to confirm"] }, { contains = ["enter send"] }, { contains = ["press enter"] }, { contains = ["↑/↓ select"] }, { contains = ["↑/↓ to select"] }, { contains = ["other (type"] }] },
]

[[rules]]
id = "credential_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(14)"
visible_blocker = true
any = [
  { contains = ["sudo password"] },
  { contains = ["skill setup"] },
  { contains = ["🔑", "for "] },
  { contains = ["type password (hidden)", "enter to submit", "esc to skip"] },
  { contains = ["type the code", "enter to submit", "esc to skip"] },
  { contains = ["type your email / username", "enter to continue", "esc to skip"] },
]

[[rules]]
id = "confirmation_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(14)"
visible_blocker = true
all = [
  { any = [{ contains = ["approve once", "cancel"] }, { contains = ["start a new session", "keep going"] }] },
  { any = [{ contains = ["enter to confirm"] }, { contains = ["enter confirm"] }, { contains = ["type 1/2/3"] }, { contains = ["y/n quick"] }] },
]

[[rules]]
id = "interrupt_status_working"
state = "working"
priority = 950
region = "bottom_non_empty_lines(5)"
visible_working = true
any = [
  { contains = ["msg=interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
]

[[rules]]
id = "classic_cancel_working"
state = "working"
priority = 500
region = "bottom_non_empty_lines(5)"
visible_working = true
contains = ["ctrl+c cancel"]

# The placeholder disappears while the user types; the caduceus remains the
# live agent-running marker. Scope it to the composer, excluding scrollback.
[[rules]]
id = "running_prompt"
state = "working"
priority = 500
region = "prompt_box_body"
visible_working = true
regex = ['\A\s*☤(?:\s|$)']

# Minimal chrome has only the top rule, so there is no complete prompt box.
[[rules]]
id = "running_compact_prompt"
state = "working"
priority = 500
region = "after_last_horizontal_rule"
visible_working = true
regex = ['\A\s*☤(?:\s|$)']

[[rules]]
id = "local_command_working"
state = "working"
priority = 500
region = "bottom_non_empty_lines(5)"
visible_working = true
contains = ["command in progress"]
any = [
  { contains = ["input temporarily disabled"] },
  { contains = ["input stays active; enter queues"] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['^✓[\u{fe0e}\u{fe0f}]?(?:\s|$)']
