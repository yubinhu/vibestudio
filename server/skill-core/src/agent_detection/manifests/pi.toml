id = "pi"
version = "2026.09.20.1"
min_engine_version = 1
updated_at = "2026-09-20T00:00:00Z"
aliases = ["herdr:pi"]

# Pi 0.86.1 embeds its default spinner and "Working" in the editor border.
# Published source: coding-agent's CustomEditor/WorkingStatusIndicator and
# pi-tui's Loader. Match live controls near the prompt, never ordinary prose.
[[rules]]
id = "working_editor_border"
state = "working"
priority = 200
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*──\s+[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]\s+Working(?:\.{3}|…)?\s+─.*$']

# Narrow editor borders collapse the label to just the active spinner.
[[rules]]
id = "working_compact_border"
state = "working"
priority = 190
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*─{1,3}\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]\s*─+(?:\s+↑\s+\d+\s+more\s+─+)?\s*$']

# Older Pi and custom editors put the same loader on its own line.
[[rules]]
id = "working_status_line"
state = "working"
priority = 100
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]\s+Working(?:\.{3}|…)?\s*$']

[[rules]]
id = "retry_or_compaction"
state = "working"
priority = 210
region = "bottom_non_empty_lines(16)"
visible_working = true
line_regex = ['^\s*(?:──\s+)?[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]\s+(?:Retrying\s+\(\d+/\d+\)\s+in\s+\d+s|Compacting context|(?:Context overflow detected, )?Auto-compacting|Summarizing branch)\.{3}\s+\([^\r\n]+ to cancel\)(?:\s+─.*)?\s*$']
