[package]
name = "skill-term"
version.workspace = true
edition = "2021"
description = "App-managed, tmux-backed agent terminals (PTY bridge) shared by the desktop app and headless server"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
skill-core = { path = "../skill-core" }
# Logging facade only (the hosting binary installs the subscriber).
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
