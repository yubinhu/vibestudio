name: ci

# Pre-merge gate. The release workflow (release.yml) only runs on `v*` tags and
# never validates a PR, so without this nothing runs `lint`, `clippy`, `test`, or
# the `tsc --noEmit && vite build` gate before code lands on master. A green run
# here predicts a green release: the server job builds the exact `-p skill-server`
# unit the release leg ships, and the desktop job `cargo check`s the Tauri crate.
on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The React 19 + TS SPA in client/web: the same lint + build the maintainer runs
  # locally (package.json `lint`/`build`). `build` is `tsc --noEmit && vite build`,
  # so it type-checks the whole frontend AND proves the bundle compiles.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test release manifests and workspace state
        run: npm test
      - run: npm run lint
      - run: npm run build

  # The transport-agnostic backend (server/skill-core, skill-term, skill-server).
  # No webkit/Tauri deps, so clippy + the existing unit/integration tests (incl.
  # server/skill-server/tests/proxy_smoke.rs) run fast and cache cleanly. Run on
  # macOS too so native descriptor isolation and session working-directory
  # regressions are checked before tagging. Install tmux on both platforms so
  # skill-term's terminal tests actually run instead of skipping.
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install tmux (Linux skill-term tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS skill-term tests)
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null 2>&1 || brew install tmux
      # clippy on the server crates (no webkit deps; the desktop crate is checked in
      # its own job below). `-D warnings` makes any lint fatal — the tree is clean,
      # so this keeps it that way. (No rustfmt gate: formatting is hand-maintained.)
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets

  # The Tauri shell (client/desktop, crate `vibestudio`). tauri-build validates
  # the frontendDist at check time, so the SPA must be built into ./dist first.
  # A `cargo check` (not a full bundle — that's the release's job) catches Rust /
  # tauri.conf drift pre-merge, which today only surfaces when a tag is cut.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./client/desktop -> target"
      - run: npm ci
      - name: Build SPA (tauri-build needs frontendDist)
        run: npm run build
      # The on-device llama.cpp engine is no longer a bundle resource (commit-message
      # drafting shells out to a logged-in coding-agent CLI by default), so there's
      # nothing to stub before the desktop `cargo check`.
      - name: cargo check (desktop shell)
        working-directory: client/desktop
        run: cargo check --locked

  # Compile and link the actual iOS app, then catch native startup crashes in a
  # simulator. No Apple account, distribution certificate or upload is involved.
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./client/desktop -> target"
          key: ios-simulator
      - run: npm ci
      # iOS resolves bundled resources before running beforeBuildCommand.
      - name: Build SPA for iOS resource resolution
        run: npm run build
      - name: Build unsigned simulator app
        # --no-sign is supported by the CLI version in package-lock.json.
        # The Rust arguments after -- also apply to the Xcode build script.
        run: npm run tauri -- ios build --debug --target aarch64-sim --no-sign --ci -- --locked
      - name: Launch simulator app
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-smoke"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-smoke/devices.json"
          device=$(python3 - "$RUNNER_TEMP/ios-smoke/devices.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]
          candidates = [device for runtime, group in devices.items()
                        if ".iOS-" in runtime for device in group
                        if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(candidates[0]["udid"], candidates[0]["state"])
          PY
          )
          read -r device_id device_state <<< "$device"
          simulator_app=client/desktop/gen/apple/build/arm64-sim/VibeStudio.app
          app_pid=
          collect_evidence() {
            result=$?
            trap - EXIT
            set +e
            # All diagnostics are best-effort; preserve the smoke check's status.
            if [[ -n "$app_pid" ]]; then
              if [[ "$result" -ne 0 ]]; then
                sample "$app_pid" 5 -file "$RUNNER_TEMP/ios-smoke/process-sample.txt"
              fi
              lsof -nP -a -p "$app_pid" -iTCP -sTCP:LISTEN -Fn > "$RUNNER_TEMP/ios-smoke/listeners.txt"
              while IFS= read -r port; do
                curl --max-time 5 --silent --show-error \
                  -D "$RUNNER_TEMP/ios-smoke/root-$port.headers" \
                  "http://127.0.0.1:$port/" > "$RUNNER_TEMP/ios-smoke/root-$port.html"
                curl --max-time 5 --silent --show-error \
                  -D "$RUNNER_TEMP/ios-smoke/profiles-$port.headers" \
                  "http://127.0.0.1:$port/api/remote/profiles" > "$RUNNER_TEMP/ios-smoke/profiles-$port.json"
              done < <(sed -n 's/^n127\.0\.0\.1://p' "$RUNNER_TEMP/ios-smoke/listeners.txt")
            fi
            data_dir=$(xcrun simctl get_app_container "$device_id" one.vibestudio.app data)
            if [[ -n "$data_dir" && -d "$data_dir/Library/Logs" ]]; then
              cp -R "$data_dir/Library/Logs" "$RUNNER_TEMP/ios-smoke/app-logs"
            fi
            xcrun simctl spawn "$device_id" log show --last 5m --style compact --info --debug \
              --predicate 'process == "VibeStudio" OR process CONTAINS "WebKit"' \
              > "$RUNNER_TEMP/ios-smoke/unified.log" 2>&1
            xcrun simctl shutdown "$device_id" >/dev/null 2>&1
            exit "$result"
          }
          trap collect_evidence EXIT
          find "$simulator_app" -maxdepth 4 -type f | sort > "$RUNNER_TEMP/ios-smoke/bundle-files.txt"
          test -f "$simulator_app/assets/dist/index.html"
          cp "$simulator_app/assets/dist/index.html" "$RUNNER_TEMP/ios-smoke/bundled-index.html"
          plutil -convert xml1 -o "$RUNNER_TEMP/ios-smoke/Info.plist" "$simulator_app/Info.plist"
          xcrun swiftc scripts/ios-launch-check.swift -o "$RUNNER_TEMP/ios-launch-check"
          if [[ "$device_state" != Booted ]]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          # Ad-hoc signing satisfies arm64 simulator execution; it needs no key.
          codesign --force --deep --sign - "$simulator_app"
          xcrun simctl install "$device_id" "$simulator_app"
          launch_output=$(SIMCTL_CHILD_RUST_LOG=warn,skill_server=debug,skill_core=debug,skill_client=debug \
            xcrun simctl launch \
            --stdout="$RUNNER_TEMP/ios-smoke/stdout.log" \
            --stderr="$RUNNER_TEMP/ios-smoke/stderr.log" \
            "$device_id" one.vibestudio.app)
          echo "$launch_output"
          app_pid=${launch_output##*: }
          [[ "$app_pid" =~ ^[0-9]+$ ]]
          deadline=$((SECONDS + 180))
          attempt=0
          ready=false
          while (( SECONDS < deadline )); do
            kill -0 "$app_pid"
            attempt=$((attempt + 1))
            screenshot="$RUNNER_TEMP/ios-smoke/launch-$attempt.png"
            xcrun simctl io "$device_id" screenshot "$screenshot"
            cp "$screenshot" "$RUNNER_TEMP/ios-smoke/launch.png"
            if "$RUNNER_TEMP/ios-launch-check" "$screenshot" \
              > "$RUNNER_TEMP/ios-smoke/launch-$attempt.txt" \
              2> "$RUNNER_TEMP/ios-smoke/launch-$attempt-ocr.log"; then
              ready=true
              break
            fi
            sleep 10
          done
          if [[ "$ready" != true ]]; then
            echo "The simulator never displayed the mobile connection screen." >&2
            exit 1
          fi
          kill -0 "$app_pid"
      - name: Upload simulator launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: ${{ runner.temp }}/ios-smoke
          if-no-files-found: ignore
