name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v1.1.4)"
        required: true
        type: string

permissions:
  contents: read

# A retry must not modify the same draft concurrently with its original run.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Select an existing stable version tag, for example v1.1.4 (not a branch)."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - name: Refuse to rebuild a published version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == false) | .tag_name")
          if [ -n "$published" ]; then
            echo "::error::This version is already public. Choose a new version instead of replacing shipped binaries."
            exit 1
          fi
      - name: Check updater signing configuration before building
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set TAURI_SIGNING_PRIVATE_KEY to the key matching tauri.conf.json. See RELEASING.md."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const key = JSON.parse(fs.readFileSync("client/desktop/tauri.conf.json")).plugins.updater.pubkey;
            if (!key || key.includes("PLACEHOLDER")) throw new Error("Configure plugins.updater.pubkey before releasing");
          '

  build:
    needs: preflight
    # tauri-action creates the GitHub Release and uploads assets — needs write.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # webkit2gtk-4.1 + glibc friendly for AppImage
          - platform: macos-latest # Apple silicon — builds one universal (arm64+x86_64) bundle
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./client/desktop -> target"

      - run: npm ci

      # Commit-message drafting uses a logged-in coding-agent CLI. The optional
      # offline engine is user-provided, so it is not a release bundle resource.

      # Stamp the release version (the pushed tag, minus the leading `v`) into the
      # server workspace and desktop package so both binaries build at the tag version.
      # Manual runs check out the requested tag and use the same version as tag pushes.
      - name: Sync version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: bash scripts/stamp-version.sh "${RELEASE_TAG#v}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub runners lack FUSE, so AppImage's bundler (linuxdeploy / appimagetool)
          # fails to mount its tools ("failed to run linuxdeploy"). This makes them
          # self-extract and run without FUSE. No-op on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # macOS code signing (Developer ID) + notarization: with these set,
          # tauri-action imports the cert and `tauri build` signs, notarizes, and
          # staples automatically. APPLE_SIGNING_IDENTITY overrides the ad-hoc "-"
          # in tauri.conf.json; the vars are ignored on the Windows/Linux legs.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing (minisign .sig files, separate from OS code
          # signing). Unset password defaults to empty on CI.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client/desktop
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: "VibeStudio ${{ needs.preflight.outputs.tag }}"
          releaseDraft: true
          prerelease: false
          # Publish one complete manifest in finalize, after every platform uploads.
          # Parallel tauri-action manifest merges can lose entries or delete signatures.
          includeUpdaterJson: false
          retryAttempts: 3
          # Per-platform args (&& / || precedence: each `A && B` resolves before the `||`s):
          #  • macOS: one universal (arm64+x86_64) .dmg on the Apple-Silicon runner.
          #  • Linux: .deb only; AppImage bundling is disabled on CI.
          #  • Windows: no Authenticode signCommand is configured. Updater .sig
          #    generation remains enabled on every platform.
          args: ${{ startsWith(matrix.platform, 'macos') && '--target universal-apple-darwin' || startsWith(matrix.platform, 'ubuntu') && '--bundles deb' || '' }}

      - name: Upload desktop bundles
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: vibestudio-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            client/desktop/target/release/bundle/deb/*.deb
            client/desktop/target/release/bundle/nsis/*.exe
            client/desktop/target/release/bundle/nsis/*.msi
            client/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            client/desktop/target/universal-apple-darwin/release/bundle/macos/*.app
            client/desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  # Standalone `skill-server` binaries for the Remote-SSH feature. The desktop app
  # provisions one onto a remote host on demand (VS Code-style: the remote curls it,
  # with a local-download-piped-over-ssh fallback). Static musl on Linux so glibc skew
  # on old remotes never bites; native builds on macOS. Uploaded to the SAME release
  # as the desktop bundles (needs: build, which creates the draft via tauri-action).
  # The desktop fetches the asset from the release tag matching its own version (the
  # "Sync app version from tag" step above stamps that version), so a fresh remote
  # downloads the right binary. (Build-time override: VIBESTUDIO_SERVER_BASE_URL.)
  server-binaries:
    name: skill-server (${{ matrix.target }})
    # Run AFTER build (so the draft release usually exists) but NOT gated on its
    # success: a flaky desktop leg (signing/notarization) must not skip the server
    # binaries, or Remote-SSH can't provision that release. The job ensures the release
    # exists itself before uploading.
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-22.04-arm # GitHub-hosted arm64 Linux runner
            target: aarch64-unknown-linux-musl
            musl: true
          - runner: macos-latest # Apple silicon
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install musl toolchain (Linux)
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Stamp the server workspace so the standalone binary's `--version` matches the
      # release it ships in (this job checks out fresh, so it must stamp too).
      - name: Sync version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: bash scripts/stamp-version.sh "${RELEASE_TAG#v}"

      # The standalone binary is the phone's hub while SSH-connected, so it must
      # carry the SPA: build dist/, then compile it in via embed-ui (include_dir).
      - name: Build the UI (embedded into the binary)
        run: npm ci && npm run build

      # Builds ONLY skill-server (+ skill-core/skill-term) — no tauri/webkit deps, so
      # the static musl link is clean and fast.
      - name: Build skill-server
        env:
          CARGO_NET_RETRY: 10
        run: cargo build --release -p skill-server --bin skill-server --features embed-ui --target ${{ matrix.target }}

      - name: Package + checksum
        shell: bash
        run: |
          out="skill-server-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/skill-server" "$out"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$out" > "$out.sha256"; else shasum -a 256 "$out" > "$out.sha256"; fi

      # The draft is normally created by tauri-action in `build`; create it if a build
      # failure meant it never got made. Re-read after a competing matrix leg creates it.
      - name: Ensure the release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "VibeStudio $RELEASE_TAG" \
              --notes "Desktop bundles and standalone skill-server binaries." || \
            gh release view "$RELEASE_TAG" >/dev/null

      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$RELEASE_TAG" "skill-server-$TARGET" "skill-server-$TARGET.sha256" --clobber

  finalize:
    needs: [preflight, build, server-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate assets, stabilize download names, and generate complete updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: node scripts/finalize-release.mjs

  smoke:
    needs: [preflight, finalize]
    permissions:
      contents: write
    uses: ./.github/workflows/provision-smoke.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
